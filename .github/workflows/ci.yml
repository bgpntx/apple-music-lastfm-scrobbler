name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Swift tests
    runs-on: macos-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release
