name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Music.app
        2. Play a track
        3. Run ...
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.6"
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version
      placeholder: "swift --version"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets before posting logs.
      render: text
